<article class="product-card">
  <a [routerLink]="['/products', product.id]" class="card-img-wrapper">
    <img [src]="product.thumbnail" [alt]="product.name" loading="lazy" />
    @if (discount > 0) {
      <span class="discount-badge">-{{ discount }}%</span>
    }
    @if (product.stock === 0) {
      <span class="out-of-stock-overlay">Out of Stock</span>
    }
    <div class="card-overlay">
      <button class="quick-add-btn" (click)="addToCart($event)" [disabled]="product.stock === 0">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        Add to Cart
      </button>
    </div>
  </a>

  <button
    class="wishlist-btn"
    [class.active]="isWishlisted"
    (click)="toggleWishlist($event)"
    aria-label="Toggle wishlist"
  >
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" [attr.fill]="isWishlisted ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2">
      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
    </svg>
  </button>

  <div class="card-body">
    <div class="card-brand">{{ product.brand }}</div>
    <a [routerLink]="['/products', product.id]" class="card-name">{{ product.name }}</a>
    <div class="card-rating">
      <app-star-rating [rating]="product.rating" [reviewCount]="product.reviewCount" [showCount]="true"></app-star-rating>
    </div>
    <div class="card-footer">
      <div class="price-group">
        <span class="price">₹{{ product.price | number:'1.2-2' }}</span>
        @if (product.originalPrice) {
          <span class="original-price">₹{{ product.originalPrice | number:'1.2-2' }}</span>
        }
      </div>
      <button class="add-to-cart-btn" (click)="addToCart($event)" [disabled]="product.stock === 0">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
  </div>
</article>
